name: Vigilancia de normativa BOE
on:
  schedule:
    # Cada lunes a las 06:00 UTC. Cadencia semanal a propósito: la vigencia
    # de una norma no cambia con más frecuencia y evita ruido de issues.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/watch-boe.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
